name: Retrofit installed Android smoke

on:
  pull_request:
    paths:
      - 'app/**'
      - 'scripts/qualify-real-photo-picker.py'
      - '.github/workflows/android-installed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Grant KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Installed native picker, persistence and marker journey
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: |
            gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            test "$(adb shell getprop ro.kernel.qemu | tr -d '\r')" = "1"
            test "$(adb shell pm clear dev.gamesbyian.retrofit | tr -d '\r')" = "Success"
            python3 scripts/qualify-real-photo-picker.py --out app/build/reports/real-picker
            gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace
      - name: Retain instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrofit-installed-test-report
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/real-picker/
          if-no-files-found: warn
          retention-days: 7
